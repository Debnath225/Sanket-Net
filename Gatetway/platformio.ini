[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
src_dir = main
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
lib_deps =
    adafruit/Adafruit Unified Sensor
    sandeepmistry/LoRa
    knolleary/PubSubClient
